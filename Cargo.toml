[package]
name = "cargo-slot"
version = "0.1.0"
edition = "2024"
description = "Share incremental Rust builds across git worktrees"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3"
